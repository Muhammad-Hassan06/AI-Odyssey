# Label Mapping & Semantic Schema Configuration
# Pakistani Context NER - TechFest NER Challenge (Round 2)
# Strictly 20 Predefined Categories with flat IOB2 tag mappings

version: "2.0"

entities:
  - id: 0
    name: "PERSON"
    iob_b: "B-PERSON"
    iob_i: "I-PERSON"
    description: "Named individual human beings (titles and honorifics excluded)."
    exemplars: ["Muhammad Ali Jinnah", "Maryam Nawaz", "Qazi Faez Isa", "Babar Azam"]

  - id: 1
    name: "CITY"
    iob_b: "B-CITY"
    iob_i: "I-CITY"
